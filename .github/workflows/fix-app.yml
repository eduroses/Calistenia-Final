name: Fix Calistenia app

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[cal-app-fix]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch and verify next exercise navigation
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re

          index = Path('index.html')
          text = index.read_text(encoding='utf-8')
          marker = '<!-- CALISTENIA NEXT EXERCISE FIX V2 -->'

          if marker not in text:
              patch = '''<script>
          <!-- CALISTENIA NEXT EXERCISE FIX V2 -->
          (function(){
            'use strict';
            function goNext(e){
              var btn=e.target && e.target.closest ? e.target.closest('button') : null;
              if(!btn) return;
              var label=(btn.textContent||'').replace(/\\s+/g,' ').trim().toLowerCase();
              if(label.indexOf('siguiente ejercicio')===-1) return;
              var items=Array.prototype.slice.call(document.querySelectorAll('.work-item'));
              if(!items.length) return;
              var active=document.querySelector('.work-item.active');
              var idx=items.indexOf(active);
              if(idx<0) return;
              var next=items[idx+1];
              if(!next) return;
              e.preventDefault();
              e.stopPropagation();
              if(e.stopImmediatePropagation) e.stopImmediatePropagation();
              next.dispatchEvent(new MouseEvent('click',{bubbles:true,cancelable:true,view:window}));
            }
            document.addEventListener('click',goNext,true);
          })();
          </script>'''
              if '</body>' not in text:
                  raise SystemExit('No </body> found; refusing unsafe patch.')
              text = text.replace('</body>', patch + '\n</body>', 1)

          text = re.sub(r'sw\\.js\\?v=final\\d+', 'sw.js?v=final16', text)
          index.write_text(text, encoding='utf-8')

          assert text.count(marker) == 1
          assert "document.querySelectorAll('.work-item')" in text
          assert "label.indexOf('siguiente ejercicio')" in text
          assert "document.addEventListener('click',goNext,true)" in text
          assert '</body>' in text
          print('NEXT EXERCISE FIX V2 VERIFIED')
          PY

      - name: Commit verified fix
        shell: bash
        run: |
          git config user.name 'calistenia-app-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'No changes needed.'
            exit 0
          fi
          git commit -m '[cal-app-fix] verified next exercise navigation v2'
          git push
