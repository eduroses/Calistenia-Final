name: Fix Calistenia app

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[cal-app-fix]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch and verify next exercise navigation
        shell: python
        run: |
          from pathlib import Path
          import re

          index = Path('index.html')
          text = index.read_text(encoding='utf-8')

          marker = '<!-- CALISTENIA NEXT EXERCISE FIX V1 -->'
          if marker not in text:
              patch = r'''<script>
<!-- CALISTENIA NEXT EXERCISE FIX V1 -->
(function(){
  function nextExerciseFromButton(e){
    var btn=e.target && e.target.closest ? e.target.closest('button') : null;
    if(!btn) return;
    var label=(btn.textContent||'').replace(/\s+/g,' ').trim().toLowerCase();
    if(label.indexOf('siguiente ejercicio')===-1) return;
    var items=Array.prototype.slice.call(document.querySelectorAll('.work-item'));
    if(!items.length) return;
    var active=document.querySelector('.work-item.active');
    var idx=items.indexOf(active);
    if(idx<0) idx=0;
    var next=items[idx+1];
    if(next){
      e.preventDefault();
      e.stopPropagation();
      if(e.stopImmediatePropagation) e.stopImmediatePropagation();
      next.click();
    }
  }
  document.addEventListener('click', nextExerciseFromButton, true);
})();
</script>'''
              if '</body>' not in text:
                  raise SystemExit('No </body> found; refusing unsafe patch.')
              text = text.replace('</body>', patch + '\n</body>', 1)

          # Refresh the service-worker query string so installed PWAs load the patched HTML.
          text = re.sub(r'sw\.js\?v=final\d+', 'sw.js?v=final15', text)
          index.write_text(text, encoding='utf-8')

          # Static checks: the navigation patch must exist exactly once and target the real workout items.
          assert text.count(marker) == 1
          assert "document.querySelectorAll('.work-item')" in text
          assert "label.indexOf('siguiente ejercicio')" in text
          assert "document.addEventListener('click', nextExerciseFromButton, true)" in text
          assert '</body>' in text
          print('NEXT EXERCISE PATCH VERIFIED')

      - name: Commit verified navigation fix
        shell: bash
        run: |
          git config user.name 'calistenia-app-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'No changes needed.'
            exit 0
          fi
          git commit -m '[cal-app-fix] verified next exercise navigation'
          git push
